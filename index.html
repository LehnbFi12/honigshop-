<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honigshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Willkommen im Honigshop!</h1>
    <p>Hier findest du leckeren Honig in verschiedenen Größen.</p>
  </header>

  <div class="products">
    <div class="product">
      <img src="images/honig500g.jpg" alt="Honig 500g" class="product-image">
      <h2>Honig (500g)</h2>
      <p>Preis: 5€</p>
      <button onclick="addToCart('Honig 500g', 5)">In den Warenkorb</button>
    </div>

    <div class="product">
      <img src="images/honig1kg.jpg" alt="Honig 1kg" class="product-image">
      <h2>Honig (1kg)</h2>
      <p>Preis: 8€</p>
      <button onclick="addToCart('Honig 1kg', 8)">In den Warenkorb</button>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Honigshop - Alle Rechte vorbehalten</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
