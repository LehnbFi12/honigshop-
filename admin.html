<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Honigshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Admin Bereich</h1>
    <nav>
      <a href="index.html">Startseite</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>

  <main>
    <section class="product-management">
      <h2>Produkte verwalten</h2>
      <form id="add-product-form">
        <input type="text" id="product-name" placeholder="Produktname" required>
        <input type="number" id="product-price" placeholder="Preis" required>
        <textarea id="product-description" placeholder="Beschreibung" required></textarea>
        <input type="file" id="product-image" accept="image/*" required>
        <button type="submit">Produkt hinzufügen</button>
      </form>

      <h3>Alle Produkte</h3>
      <ul id="product-list">
        <!-- Produktliste wird hier geladen -->
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Honigshop - Alle Rechte vorbehalten</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
